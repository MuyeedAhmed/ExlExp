name: Build & Release Android AAB (Play Store)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prebuild Expo Native App
        run: npx expo prebuild --platform android --no-install

      - name: Build Android Release AAB (App Bundle)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Find Build Artifacts
        run: |
          echo "Listing generated AABs:"
          find android/app/build/outputs/bundle/release/ -type f || true

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          files: android/app/build/outputs/bundle/release/*.aab
          name: Android AAB Release ${{ github.sha }}
          tag_name: android-aab-${{ github.sha }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
